# Quick Draw — iOS CI
#
# Two jobs:
#   test   — build the app + run the full unit-test suite on an iOS simulator.
#            Runs on every push and pull request.
#   deploy — archive a Release build with Apple cloud-managed signing and
#            upload it to TestFlight. Runs on pushes to main and on manual
#            dispatch. Requires the four repository secrets described in
#            docs/TESTFLIGHT_SETUP.md:
#              ASC_KEY_ID       App Store Connect API key ID
#              ASC_ISSUER_ID    App Store Connect issuer ID
#              ASC_KEY_P8       full contents of the AuthKey_XXXX.p8 file
#              APPLE_TEAM_ID    10-character Apple Developer Team ID
#
# TestFlight builds are compiled with the TESTFLIGHT_TOOLS condition by
# default, which keeps the diagnostics overlay, debug menu, and simulated
# opponent available for on-phone tuning. Dispatch with include_tools=false
# to produce a clean build for App Store review.

name: iOS CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      include_tools:
        description: "Compile TESTFLIGHT_TOOLS (diagnostics + simulated opponent)"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & unit tests (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick a simulator
        id: sim
        # Use whatever recent iPhone simulator the runner image ships with,
        # so the workflow doesn't break when Apple renames devices.
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[^(]*' | head -1 | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          run_tests() {
            xcodebuild test \
              -project QuickDraw.xcodeproj \
              -scheme QuickDraw \
              -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
              -resultBundlePath build/TestResults.xcresult \
              CODE_SIGNING_ALLOWED=NO
          }
          if command -v xcbeautify >/dev/null 2>&1; then
            run_tests | xcbeautify --renderer github-actions
          else
            run_tests
          fi

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore

  deploy:
    name: TestFlight upload
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Push-triggered deploys always include the tools; manual dispatch can
      # turn them off for an App Store review build.
      TOOLS_CONDITION: ${{ (github.event_name == 'push' || inputs.include_tools) && 'TESTFLIGHT_TOOLS' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive (Release, cloud-managed signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project QuickDraw.xcodeproj \
            -scheme QuickDraw \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/QuickDraw.xcarchive \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$TOOLS_CONDITION"

      - name: Upload to TestFlight
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/QuickDraw.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up API key
        if: always()
        run: rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
